version: '3.9'

services:
  postgres:
    build: 
      context: ./postgres
      dockerfile: Dockerfile.postgres
    container_name: chat_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: chat_api
    volumes:
      - .:/chatbot
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: python chatbot/manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    restart: always
  
  llama:
    build: 
      context: .
      dockerfile: Dockerfile.llama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  
              capabilities: [gpu]
    volumes:
      - ollama:/root/.ollama  # Correctly formatted as an array
    container_name: ollama_llama
    restart: always
    ports:
      - "11434:11434"  
    environment:
      - MODEL=llama-3.1-7b  
    command: ["serve"]  # Make sure to use the correct command format

volumes:
  postgres_data:
  ollama:
